name: Сборка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Манифест прав администратора
        shell: bash
        run: |
          go install github.com/akavel/rsrc@latest
          rsrc -manifest assets/discord-fix.manifest -arch amd64 -o cmd/discord-fix/rsrc_windows_amd64.syso

      - name: Юнит-тесты
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Сборка exe
        shell: bash
        run: go build -ldflags "-H=windowsgui -s -w -X main.version=dev-${GITHUB_SHA:0:7}" -o discord-fix.exe ./cmd/discord-fix

      - name: Контроль - манифест и версия вшиты в exe
        shell: bash
        run: |
          grep -aoq requireAdministrator discord-fix.exe
          grep -aoq "dev-" discord-fix.exe

      - name: Самопроверка
        run: ./discord-fix.exe -selftest

      - uses: actions/upload-artifact@v4
        with:
          name: discord-fix-exe
          path: discord-fix.exe
          retention-days: 14
