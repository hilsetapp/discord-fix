name: Сборка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Юнит-тесты
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Сборка exe
        run: go build -ldflags "-H=windowsgui -s -w" -o discord-fix.exe ./cmd/discord-fix

      - name: Самопроверка (хеши ядер, стратегии)
        shell: pwsh
        run: |
          # Start-Process с -Wait: иначе у оконной программы теряется код выхода
          $p = Start-Process -FilePath .\discord-fix.exe -ArgumentList '-selftest' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Самопроверка провалилась, код $($p.ExitCode)" }
          if (-not (Test-Path cores/zapret/cygwin1.dll)) { throw "в сборке нет cygwin1.dll - winws не запустится" }

      - uses: actions/upload-artifact@v4
        with:
          name: discord-fix-exe
          path: discord-fix.exe
          retention-days: 14
